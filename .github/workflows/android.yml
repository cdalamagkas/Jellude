name: Android build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Set up Gradle and validate wrapper
        uses: gradle/actions/setup-gradle@v4
      - name: Install Android platform and build tools
        run: sdkmanager 'platforms;android-35' 'build-tools;36.0.0'
      - name: Build, unit tests, and lint
        run: ./gradlew :core:test :app:assembleDebug :app:lintDebug --no-daemon
      - name: Upload development APK
        uses: actions/upload-artifact@v4
        with:
          name: Jellude-debug-${{ github.run_number }}
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
      - name: Upload verification reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verification-${{ github.run_number }}
          path: |
            core/build/reports/tests/
            app/build/reports/lint-results-debug.*
          if-no-files-found: ignore
          retention-days: 14
