name: Bug report
description: Report a reproducible problem with Jellude.
title: "[Bug]: "
body:
  - type: markdown
    attributes:
      value: |
        Jellude is experimental. Please use a small test library to reproduce download or playlist problems.
        Do not attach passwords, tokens, server addresses, personal music, or unredacted logs.
        Security vulnerabilities belong in private reporting, not this form; see SECURITY.md.
  - type: input
    id: app_version
    attributes:
      label: Jellude version or commit
      placeholder: "0.1.3, built from source"
    validations:
      required: true
  - type: input
    id: android
    attributes:
      label: Android version and device model
      placeholder: "Android 16, POCO F7 Ultra"
    validations:
      required: true
  - type: input
    id: server
    attributes:
      label: Jellyfin server version
      description: Version only; do not include the server address or account details.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: Include whether offline mode, Wi-Fi restrictions, shuffle, or repeat were enabled.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected and actual behavior
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Optional sanitized evidence
      description: Screenshots, error text, track counts, and audio formats are useful. Remove private data first.
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I removed credentials and private server details from this report and its attachments.
          required: true
